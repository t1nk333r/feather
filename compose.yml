services:
  altstore-manager:
    # image + build kept together -- `docker compose pull` fetches the
    # CI-built image (the one that was actually smoke-tested), while
    # `docker compose build` still works locally and tags the result as
    # this name.
    image: ghcr.io/d7eeem/feather:latest
    build: .
    container_name: altstore-source-manager
    ports:
      - 7000:5000
    volumes:
      # Mount only the data directory, not the entire /app
      - ./data:/app/data
      - ./data/ipas:/app/data/ipas
      - ./data/icons:/app/data/icons
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4096m
    # Healthcheck now lives solely in the Dockerfile (Plan 010) -- this
    # duplicate definition previously silently overrode it at runtime, and
    # the two had drifted (the Dockerfile's still carried a since-removed
    # `-u "admin:${ADMIN_PASSWORD}"` credential). One definition, in one
    # place, so they cannot disagree again.

  # Plan 013: self-hosted Bot API server (--local mode). Lifts the 20 MB
  # getFile cap the cloud Bot API imposes, which every IPA in this catalog
  # exceeds. It cannot read any chat the bot isn't a member of -- see
  # plans/013-telegram-bot-ingest.md for what self-hosting does and does
  # not change.
  telegram-bot-api:
    # Opt-in (Plan 016): not started by a plain `docker compose up -d`.
    # Enable with `docker compose --profile telegram up -d` once the
    # TELEGRAM_* variables are set in .env.
    profiles: ["telegram"]
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_LOCAL=true
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    # Deliberately NOT published to the host. Only the worker talks to it,
    # over the compose network. Exposing it would put an unauthenticated
    # file-serving endpoint on the LAN.

  # Plan 013: the forward-to-bot ingest worker. Reads files the Bot API
  # server wrote off the shared volume directly (no HTTP download), and
  # publishes to feather through the existing /api/add-version HTTP API.
  ipa-ingest-bot:
    profiles: ["telegram"]
    # image + build kept together -- `docker compose pull` fetches the
    # CI-built image (the one that was actually smoke-tested), while
    # `docker compose build` still works locally and tags the result as
    # this name.
    image: ghcr.io/d7eeem/feather-bot:latest
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ipa-ingest-bot
    depends_on:
      - telegram-bot-api
      - altstore-manager
    env_file:
      - .env
    volumes:
      # Read-only: the worker reads files the API server wrote. It has no
      # business modifying that directory.
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped
networks: {}

volumes:
  telegram-bot-api-data:
