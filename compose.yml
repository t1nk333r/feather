services:
  altstore-manager:
    build: .
    container_name: altstore-source-manager
    ports:
      - 7000:5000
    volumes:
      # Mount only the data directory, not the entire /app
      - ./data:/app/data
      - ./data/ipas:/app/data/ipas
      - ./data/icons:/app/data/icons
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4096m
    # Healthcheck now lives solely in the Dockerfile (Plan 010) -- this
    # duplicate definition previously silently overrode it at runtime, and
    # the two had drifted (the Dockerfile's still carried a since-removed
    # `-u "admin:${ADMIN_PASSWORD}"` credential). One definition, in one
    # place, so they cannot disagree again.
networks: {}
