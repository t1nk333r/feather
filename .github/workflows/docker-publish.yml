name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the container ships (Dockerfile: python:3.11-slim).
        # 3.14 is the development host. Every pin in requirements.txt has to
        # install on both — that constraint is what stalled plan 004, so it is
        # enforced here rather than rediscovered by hand.
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: requests pin must match between requirements.txt and Dockerfile.bot
        run: |
          set -euo pipefail
          REQ="$(grep -oP '^requests==\K[0-9.]+' requirements.txt)"
          BOT="$(grep -oP 'requests==\K[0-9.]+' Dockerfile.bot)"
          echo "requirements.txt: $REQ   Dockerfile.bot: $BOT"
          [ "$REQ" = "$BOT" ] || { echo "FAIL: requests pins have drifted"; exit 1; }

  build:
    name: Build and push
    needs: test
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to verify the Dockerfile still works, but must not
      # publish — a PR from a fork would otherwise push to the registry.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if it actually boots. DATA_DIR points at a
      # throwaway path so this never expects a real catalog to be present.
      - name: Smoke-test the built image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          # Plan 029: the opt-in cron release importer must be present and
          # runnable in the main image. --help touches no network and
          # needs no config, so this also proves the script and its
          # imports (stdlib + pinned requests) actually work in the image.
          OUT="$(docker run --rm "$IMAGE" python scripts/release_source_ingest.py --help)"
          echo "$OUT" | grep -q -- "--apply" \
            || { echo "FAIL: release importer --help did not mention --apply"; exit 1; }
          echo "ok: release importer --help works and mentions --apply"
          # Plan 010: the app must refuse to boot without ADMIN_PASSWORD.
          # Assert that, so a regression that silently re-allows an
          # unauthenticated boot fails the build.
          if docker run --rm -e DATA_DIR=/tmp/feather-data "$IMAGE" python -c "import app" 2>/dev/null; then
            echo "FAIL: image booted without ADMIN_PASSWORD"; exit 1
          fi
          echo "ok: refuses to boot without ADMIN_PASSWORD"
          # Self-hosted runners don't reliably expose a published container
          # port at the host's localhost (rootless/containerized Docker), so
          # curl from INSIDE the container over its own loopback -- the image
          # ships curl for its healthcheck. No host port is published.
          # A prior failed run on a persistent self-hosted runner can leave
          # this container behind (--rm only removes it on stop, which a failed
          # step skips), so clear any stale one before starting.
          docker rm -f feather-smoke 2>/dev/null || true
          docker run -d --rm --name feather-smoke \
            -e DATA_DIR=/tmp/feather-data \
            -e ADMIN_PASSWORD=ci-smoke-test-not-a-real-password "$IMAGE"
          for i in $(seq 1 30); do
            if docker exec feather-smoke curl -fsS -o /dev/null http://localhost:5000/source.json; then break; fi
            sleep 1
          done
          docker exec feather-smoke curl -fsS -o /dev/null -w 'source.json  %{http_code} %{content_type}\n' \
            http://localhost:5000/source.json
          docker exec feather-smoke curl -fsS -o /dev/null -w 'qr           %{http_code} %{content_type}\n' \
            http://localhost:5000/qr
          docker exec feather-smoke curl -fsS -o /dev/null -w 'index        %{http_code}\n' \
            http://localhost:5000/
          docker logs feather-smoke
          docker stop feather-smoke

  build-bot:
    name: Build and push (bot)
    needs: test
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to verify the Dockerfile still works, but must not
      # publish — a PR from a fork would otherwise push to the registry.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bot
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bot
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The worker long-polls and exits on missing config -- it is not a
      # server, so this asserts fail-fast behaviour rather than curling it.
      # A regression that lets it start unconfigured would also bypass the
      # allowlist check, which lives behind the same config validation.
      - name: Smoke-test the bot image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          # The worker must refuse to run unconfigured, naming what is
          # missing. That single assertion also proves the base image,
          # the pip install and the script all work.
          OUT="$(docker run --rm "$IMAGE" 2>&1 || true)"
          echo "$OUT"
          echo "$OUT" | grep -q "TELEGRAM_BOT_TOKEN" \
            || { echo "FAIL: did not name the missing variables"; exit 1; }
          if docker run --rm "$IMAGE" >/dev/null 2>&1; then
            echo "FAIL: bot started with no configuration"; exit 1
          fi
          echo "ok: refuses to run unconfigured, names the missing variables"
